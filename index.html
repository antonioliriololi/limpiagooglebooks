<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Limpieza de archivos RIS</title>
<style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; }
    textarea { width: 100%; height: 200px; }
    button { padding: 10px 20px; margin-top: 10px; }
</style>
</head>
<body>

<h2>Limpiador de archivos RIS</h2>
<p>Sube el archivo .RIS que descargaste de Google Books y eliminaré su línea publicitaria redundante e innecesaria. Luego puedes subirlo a tu Gestor Bibliográfico.</p>

<input type="file" id="fileInput" accept=".ris"><br><br>
<button onclick="cleanRIS()">Limpiar archivo</button>

<h3>Resultado:</h3>
<textarea id="output"></textarea><br>
<button onclick="downloadFile()">Descargar archivo limpio</button>

<script>
function cleanRIS() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) {
        alert("Sube un archivo .RIS primero");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const lines = e.target.result.split('\n');
        const cleaned = lines.filter(line => !line.startsWith("UR  -")).join('\n');
        document.getElementById('output').value = cleaned;
    };
    reader.readAsText(file);
}

function downloadFile() {
    const text = document.getElementById('output').value;
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "archivo_limpio.ris";
    a.click();
    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
